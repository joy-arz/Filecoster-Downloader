[package]
name = "filecoster-dl"
version = "0.1.0"
edition = "2021"
description = "Portable bulk video downloader for filecoster.com"

[dependencies]
eframe = "0.31"
egui_extras = "0.31"
rfd = "0.15"
opener = "0.7"
dirs = "6"
fs2 = "0.4"
regex = "1"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "cookies"] }
url = "2"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
